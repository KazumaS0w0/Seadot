[pytest]
# Seadot Test Configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Logging configuration
log_level = DEBUG
log_format = %(asctime)s [%(levelname)s] %(name)s - %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# Markers for organizing tests
markers =
    unit: Unit tests (individual components)
    integration: Integration tests (API, database persistence)
    slow: Slow running tests (run with -m slow flag)
    db: Tests requiring database access
    websocket: WebSocket endpoint tests

# Filter warnings during tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Add custom conftest.py for fixtures
addopts = -v --tb=short